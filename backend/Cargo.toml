[package]
name = "artixcloud-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "ArtixCloud backend API (Axum + MongoDB)"

[dependencies]
# Web
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
http = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
# Outbound WebSocket to the Proxmox serial console (self-signed TLS via rustls).
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
mongodb = "3"
bson = { version = "2", features = ["chrono-0_4"] }

# Time
chrono = { version = "0.4", features = ["serde", "clock"] }

# Crypto / auth
argon2 = "0.5"
password-hash = { version = "0.5", features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
chacha20poly1305 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"

# Validation
validator = { version = "0.18", features = ["derive"] }

# HTTP client (OAuth + Resend)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "multipart",
] }

# Errors / logging / config
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
