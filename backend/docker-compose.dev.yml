# Local development only. Production runs on Proxmox (see README).
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      APP_ENV: development
    ports:
      - "8080:8080"

volumes:
  mongo_data:
