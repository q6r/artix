name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Web dashboard
        - API (backend)
        - Container agent
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, copy-pasteable reproduction.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Ubuntu 24.04, Node 22, Rust 1.90, MongoDB 7, Firefox 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant output. Remove secrets and personal data first.
